<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graham Rapier: Contact information</title>
    <meta name="description" content="How to get in touch with Graham Rapier, business journalist">
    <meta name="author" content="Graham Rapier">
    <link rel="canonical" href="https://grahamrapier.com/contact.html">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://grahamrapier.com/contact.html">
    <meta property="og:title" content="Graham Rapier: Contact information">
    <meta property="og:description" content="How to get in touch with Graham Rapier, business journalist">
    <meta property="og:site_name" content="Graham Rapier">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:url" content="https://grahamrapier.com/contact.html">
    <meta name="twitter:title" content="Graham Rapier: Contact information">
    <meta name="twitter:description" content="How to get in touch with Graham Rapier, business journalist">
    <meta name="twitter:creator" content="@g_rapier">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #fafaf8;
            --color-text: #1a1a1a;
            --color-accent: #2a5caa;
            --color-muted: #6b6b6b;
            --color-border: #e0e0e0;
            --font-serif: 'Courier Prime', 'Courier New', monospace;
            --font-sans: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.7;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(42, 92, 170, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(42, 92, 170, 0.02) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        header {
            padding: 3rem 5%;
            border-bottom: 1px solid var(--color-border);
            background: rgba(250, 250, 248, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            font-family: var(--font-serif);
            text-decoration: none;
            color: var(--color-text);
        }

        nav {
            display: flex;
            gap: 2.5rem;
            font-family: var(--font-sans);
            font-size: 0.95rem;
        }

        nav a {
            color: var(--color-text);
            text-decoration: none;
            position: relative;
            transition: color 0.3s ease;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--color-accent);
            transition: width 0.3s ease;
        }

        nav a:hover {
            color: var(--color-accent);
        }

        nav a:hover::after {
            width: 100%;
        }

        .contact-section {
            padding: 6rem 5%;
            max-width: 800px;
            margin: 0 auto;
            min-height: 60vh;
        }

        .page-title {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 300;
            letter-spacing: -0.02em;
            margin-bottom: 2rem;
        }

        .contact-intro {
            font-size: 1.2rem;
            line-height: 1.8;
            color: var(--color-muted);
            margin-bottom: 4rem;
        }

        .contact-links {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .contact-link {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 2rem;
            border: 1px solid var(--color-border);
            text-decoration: none;
            color: var(--color-text);
            transition: all 0.3s ease;
            background: white;
        }

        .contact-link:hover {
            border-color: var(--color-accent);
            transform: translateX(4px) scale(1.01);
        }

        .contact-link-label {
            font-family: var(--font-sans);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--color-muted);
            margin-bottom: 0.25rem;
        }

        .contact-link-value {
            font-size: 1.25rem;
            font-weight: 500;
        }

        footer {
            padding: 4rem 5%;
            border-top: 1px solid var(--color-border);
            margin-top: 6rem;
        }

        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-connect-label h3 {
            font-size: 1.5rem;
            font-weight: 600;
            font-family: var(--font-sans);
            margin: 0;
        }

        .footer-links-inline {
            display: flex;
            gap: 2.5rem;
        }

        .footer-links-inline a {
            color: var(--color-text);
            text-decoration: none;
            font-family: var(--font-sans);
            font-size: 1rem;
            transition: color 0.3s ease;
        }

        .footer-links-inline a:hover {
            color: var(--color-accent);
        }

        .footer-bottom {
            max-width: 1400px;
            margin: 3rem auto 0;
            padding-top: 2rem;
            border-top: 1px solid var(--color-border);
            font-family: var(--font-sans);
            font-size: 0.9rem;
            color: var(--color-muted);
        }

        @media (max-width: 968px) {
            nav {
                gap: 1.5rem;
            }

            .footer-content {
                flex-direction: column;
                gap: 2rem;
                align-items: flex-start;
            }

            .footer-links-inline {
                flex-direction: column;
                gap: 1rem;
            }
        }

        @media (max-width: 640px) {
            .header-content {
                flex-direction: column;
                gap: 1.5rem;
                align-items: flex-start;
            }

            nav {
                flex-wrap: wrap;
            }

            .contact-link {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="/" class="logo">Graham Rapier</a>
            <nav>
                <a href="/">Portfolio</a>
                <a href="/contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <section class="contact-section">
        <h1 class="page-title">Contact</h1>

        <div class="contact-links">
            <a href="#" class="contact-link" id="email-link">
                <div>
                    <div class="contact-link-label">Email</div>
                    <div class="contact-link-value" id="email-display">Loading...</div>
                </div>
            </a>

            <a href="https://www.linkedin.com/in/grahamrapier/" target="_blank" class="contact-link">
                <div>
                    <div class="contact-link-label">LinkedIn</div>
                    <div class="contact-link-value">linkedin.com/in/grahamrapier</div>
                </div>
            </a>

            <a href="https://twitter.com/g_rapier" target="_blank" class="contact-link">
                <div>
                    <div class="contact-link-label">X/Twitter</div>
                    <div class="contact-link-value">@g_rapier</div>
                </div>
            </a>
        </div>
    </section>

    <footer>
        <div class="footer-content">
            <div class="footer-connect-label">
                <h3>Connect</h3>
            </div>
            <div class="footer-links-inline">
                <a href="https://www.linkedin.com/in/grahamrapier/" target="_blank">LinkedIn</a>
                <a href="https://twitter.com/g_rapier" target="_blank">Twitter</a>
                <a href="/cdn-cgi/l/email-protection#f99e8b98919894d78b9889909c8bb99e94989095d79a9694">Email</a>
            </div>
        </div>
        <div class="footer-bottom">
            <p>© 2026 Graham Rapier. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Anti-spam email obfuscation
        (function() {
            const user = 'graham.rapier';
            const domain = 'gmail.com';
            const email = user + '@' + domain;
            const emailLink = document.getElementById('email-link');
            const emailDisplay = document.getElementById('email-display');
            
            emailLink.href = 'mailto:' + email;
            emailDisplay.textContent = email;
        })();
    </script>
</body>
</html>
